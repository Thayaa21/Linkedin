name: Poll LinkedIn Connections
on:
  schedule:
    - cron: '0 */6 * * *'    # Poll every 6 hours
  workflow_dispatch:

# Never let two polls overlap
concurrency:
  group: linkedin-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDS_JSON }}' | base64 -d > google_creds.json
          echo '${{ secrets.LINKEDIN_COOKIES }}' | base64 -d > linkedin_cookies.json
          echo '${{ secrets.CONNECTIONS_SNAPSHOT }}' > connections_snapshot.json

      - name: Run poll
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_CREDS_FILE: google_creds.json
          COOKIES_FILE: linkedin_cookies.json
          CONNECTIONS_SNAPSHOT: connections_snapshot.json
          # GPT-4o-mini company extraction (poll only). Falls back to regex if unset.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          MAX_POLL_CONNECTIONS: '100'
          MESSAGE_APPLY_WITHIN_DAYS: '12'
        run: python -c "import asyncio; from main import poll_connections; asyncio.run(poll_connections())"

      # NOTE: sending is intentionally NOT done here.
      # send.yaml is the single owner of send_messages() — running it in both
      # workflows caused the same person to be messaged twice.